name: Publish to npm

# Runs in the public mirror (zandovi/n8n-nodes-zandovi) when a v<version> tag is
# pushed. GitHub only reads the root .github of a repository, so this file is
# inert while it lives under n8n-node/ in the monorepo.
#
# Authentication. npm allows a Trusted Publisher only on a package that already
# exists, so the first publish authenticates with an NPM_TOKEN secret: create it
# in this repo (Settings -> Secrets and variables -> Actions) before the first
# mirror run pushes a tag. After the first publish, configure the npm Trusted
# Publisher for @zandovi/n8n-nodes-zandovi (this repo, workflow publish.yml) and
# remove the NPM_TOKEN secret. The publish step passes NODE_AUTH_TOKEN from the
# secret unconditionally: npm CLI 11.5.1 or later tries OIDC trusted publishing
# first, so the token is harmless once the Trusted Publisher exists, and empty
# once the secret is removed. The job upgrades npm before publishing (Node 22
# bundles npm 10). Provenance comes from --provenance and id-token: write either way.
#
# The package's prepublishOnly script (n8n-node prerelease) refuses to publish
# unless RELEASE_MODE is set; the publish step sets it.
#
# If a run fails after the tag exists, re-run the workflow on the same tag. An
# npm version cannot be published twice (403), so a partly published version is
# fixed by bumping the patch version.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match package.json version v${VERSION}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run scan

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Publish
        run: npm publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
